name: Build and Test Pawprint Viewer

on:
  push:
  pull_request:

jobs:
  linux:
    name: GTK3 viewer and shared core
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install GTK3 runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0t64 libsecret-1-0 libnotify4

      - name: Restore
        run: dotnet restore PawprintViewer.sln

      - name: Build
        run: dotnet build PawprintViewer.sln -c Release --no-restore

      - name: Run shared core tests
        run: dotnet test Radegast.Core.Tests/Radegast.Core.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Run account integration checks
        run: dotnet run --project Radegast.Gtk.Tests/Radegast.Gtk.Tests.csproj -c Release --no-build

      - name: Collect viewer files
        run: dotnet publish Radegast.Gtk/Radegast.Gtk.csproj -c Release --no-build --no-restore -o bin/PawprintViewer

      - name: Upload viewer files
        uses: actions/upload-artifact@v4
        with:
          name: PawprintViewer-Linux
          path: bin/PawprintViewer/
          if-no-files-found: error

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: Radegast.Core.Tests/TestResults/test-results.trx
